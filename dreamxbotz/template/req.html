<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>New Movie & Web Series | Big Buck Bunny</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
<style>
    :root {
        --primary-cyan: #06b6d4;
        --primary-purple: #8b5cf6;
        --primary-pink: #ec4899;
        --primary-orange: #f59e0b;
        --dark-bg: #0f172a;
        --dark-secondary: #1e293b;
        --dark-accent: #334155;
        --glass-bg: rgba(15, 23, 42, 0.4);
        --glass-border: rgba(255, 255, 255, 0.1);
        --text-primary: #f8fafc;
        --text-secondary: #cbd5e1;
        --text-muted: #64748b;
    }
    *{margin:0;padding:0;box-sizing:border-box;}
    body{background: linear-gradient(135deg,var(--dark-bg)0%,#1a1a2e 50%,var(--dark-bg)100%);color:var(--text-primary);font-family: 'Inter', sans-serif;overflow-x:hidden;min-height:100vh;}
    .header{position:fixed;top:0;left:0;right:0;padding:1rem 2rem;background:linear-gradient(180deg, rgba(15,23,42,0.9)0%,transparent 100%);backdrop-filter:blur(20px);border-bottom:1px solid var(--glass-border);z-index:100;}
    .header-content{display:flex;justify-content:space-between;align-items:center;max-width:1400px;margin:0 auto;}
    .logo{font-family:'Orbitron', monospace;font-size:1.75rem;font-weight:900;background:linear-gradient(135deg,var(--primary-cyan),var(--primary-purple));-webkit-background-clip:text;background-clip:text;color:transparent;text-decoration:none;}
    .nav a{color:var(--text-secondary);text-decoration:none;margin-left:1rem;font-weight:500;transition:all 0.3s ease;}
    .nav a:hover{color:var(--primary-cyan);}
    .mobile-menu-btn{display:none;background:none;border:none;color:var(--text-primary);font-size:1.5rem;cursor:pointer;}
    .main-container{padding-top:6rem;max-width:1000px;margin:0 auto;padding-left:2rem;padding-right:2rem;}
    .video-container{position:relative;border-radius:1rem;overflow:hidden;background:var(--dark-secondary);}
    .info-panel{margin-top:1rem;background:var(--glass-bg);padding:1rem 1.5rem;border-radius:1rem;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;}
    .file-info h4{color:var(--text-muted);margin-bottom:0.3rem;}
    .file-name{font-family:'Orbitron', monospace;font-size:1.5rem;font-weight:700;background:linear-gradient(135deg,var(--primary-cyan),var(--primary-purple));-webkit-background-clip:text;color:transparent;}
    .panel-actions{display:flex;align-items:center;gap:1rem;flex-wrap:wrap;}
    .action-btn{padding:0.5rem 1rem;border:none;border-radius:0.5rem;background:linear-gradient(135deg,var(--primary-cyan),var(--primary-purple));color:white;cursor:pointer;display:flex;align-items:center;gap:0.5rem;}
    .action-btn.secondary{background:linear-gradient(135deg,var(--primary-purple),var(--primary-pink));}
    .action-btn.tertiary{background:linear-gradient(135deg,var(--primary-pink),var(--primary-orange));}
    .action-btn.quaternary{background:var(--dark-accent);}
    .more-players-dropdown{position:absolute;bottom:110%;right:0;width:250px;background:var(--glass-bg);padding:1rem;border-radius:0.5rem;display:none;flex-wrap:wrap;}
    .more-players-dropdown.active{display:flex;}
    .player-btn{background:rgba(30,41,59,0.7);padding:0.5rem;border-radius:0.5rem;color:var(--text-secondary);text-decoration:none;display:flex;align-items:center;gap:0.5rem;flex:1 1 45%;justify-content:center;}
    .player-btn:hover{background:var(--primary-cyan);color:white;}
    .footer{text-align:center;padding:2rem;background:var(--glass-bg);margin-top:2rem;border-top:1px solid var(--glass-border);}
</style>
</head>
<body>
<header class="header">
    <div class="header-content">
        <a href="https://t.me/+MINAQiQyVq8wMWRl" class="logo">New Movie & Web Series</a>
        <nav class="nav">
            <a href="#video-section">Stream</a>
            <a href="#explore-section">Explore</a>
            <a href="https://t.me/its_ankit_meena907">Contact Owner</a>
        </nav>
        <button class="mobile-menu-btn"><i class="fas fa-bars"></i></button>
    </div>
</header>

<div class="main-container">
    <section id="video-section">
        <div class="video-container">
            <video id="player" playsinline controls data-poster="https://i.ibb.co/PGbSZmXX/photo-2025-10-11-17-47-54-7560022393859604496.jpg">
                <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4"/>
            </video>
        </div>
        <div class="info-panel">
            <div class="file-info">
                <h4>Now Streaming</h4>
                <h2 class="file-name" id="typewriter-target">Big Buck Bunny</h2>
            </div>
            <div class="panel-actions">
                <button class="action-btn" onclick="window.location.href='https://www.w3schools.com/html/mov_bbb.mp4'"><i class="fas fa-download"></i> Download</button>
                <button class="action-btn secondary" onclick="alert('VLC Player Launch')">VLC Player</button>
                <button class="action-btn tertiary" onclick="alert('MX Player Launch')">MX Player</button>
                <button class="action-btn quaternary" id="more-players-btn" onclick="toggleMorePlayers()">More</button>
                <div class="more-players-dropdown" id="more-players-dropdown">
                    <a href="#" class="player-btn">PLAYit</a>
                    <a href="#" class="player-btn">KMPlayer</a>
                    <a href="#" class="player-btn">S Player</a>
                    <a href="#" class="player-btn">HD Player</a>
                </div>
            </div>
        </div>
    </section>

    <section id="explore-section" style="margin-top:2rem;">
        <h2 style="text-align:center;">Explore Our Universe</h2>
        <div style="display:flex;gap:1rem;flex-wrap:wrap;justify-content:center;margin-top:1rem;">
            <a href="https://t.me/+MINAQiQyVq8wMWRl" class="action-btn">New Movie Update</a>
            <a href="https://t.me/newmovieswebseries_group" class="action-btn secondary">Movie Req Group</a>
            <a href="https://t.me/its_ankit_meena907" class="action-btn tertiary">Contact Owner</a>
        </div>
    </section>
</div>

<footer class="footer">
    <p>Credit: 【𝐃𝐞𝐯𝐞𝐥𝐨𝐩𝐞𝐫_𝐁𝐨𝐲™(𝓐𝓷𝓴𝓲𝓽_𝓜𝓮𝓮𝓷𝓪😝)】</p>
</footer>

<script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>
<script>
const moreBtn = document.getElementById('more-players-btn');
const dropdown = document.getElementById('more-players-dropdown');
function toggleMorePlayers(){dropdown.classList.toggle('active');}
</script>
</body>
</html>
