        :root {
            --primary-cyan: #06b6d4;
            --primary-purple: #8b5cf6;
            --primary-pink: #ec4899;
            --primary-orange: #f59e0b;
            --dark-bg: #0f172a;
            --dark-secondary: #1e293b;
            --dark-accent: #334155;
            --glass-bg: rgba(15, 23, 42, 0.4);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-primary: #f8fafc;
            --text-secondary: #cbd5e1;
            --text-muted: #64748b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, var(--dark-bg) 0%, #1a1a2e 50%, var(--dark-bg) 100%);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            min-height: 100vh;
        }

        #particle-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .gradient-overlay {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at 30% 20%, rgba(6, 182, 212, 0.15), transparent 50%),
                radial-gradient(circle at 70% 80%, rgba(139, 92, 246, 0.15), transparent 50%),
                radial-gradient(circle at 40% 60%, rgba(236, 72, 153, 0.1), transparent 50%);
            z-index: 2;
            pointer-events: none;
        }

        .glass {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            padding: 1rem 2rem;
            background: linear-gradient(180deg, rgba(15, 23, 42, 0.9) 0%, transparent 100%);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-border);
        }

        .header-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            max-width: 1400px;
            margin: 0 auto;
        }

        .logo {
            font-family: 'Orbitron', monospace;
            font-size: 1.75rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--primary-cyan), var(--primary-purple));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .nav {
            display: flex;
            align-items: center;
            gap: 2rem;
        }

        .nav a {
            color: var(--text-secondary);
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
            position: relative;
            padding: 0.5rem 0;
        }

        .nav a:hover {
            color: var(--primary-cyan);
        }

        .mobile-menu-btn {
            display: none;
            background: none;
            border: none;
            color: var(--text-primary);
            font-size: 1.5rem;
            cursor: pointer;
        }

        .mobile-nav {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border-top: 1px solid var(--glass-border);
            padding: 1rem;
        }

        .mobile-nav.active {
            display: block;
        }

        .mobile-nav a {
            display: block;
            padding: 1rem;
            color: var(--text-secondary);
            text-decoration: none;
            border-radius: 8px;
        }

        .mobile-nav a:hover {
            background: rgba(255, 255, 255, 0.05);
            color: var(--primary-cyan);
        }

        .main-container {
            position: relative;
            z-index: 10;
            padding-top: 6rem;
            max-width: 1400px;
            margin: 0 auto;
            padding-left: 2rem;
            padding-right: 2rem;
        }

        .video-section {
            margin-bottom: 4rem;
        }

        .video-container {
            position: relative;
            margin-bottom: 2rem;
            border-radius: 1.5rem;
            overflow: hidden;
            background: var(--dark-secondary);
        }

        .video-container::before {
            content: '';
            position: absolute;
            inset: -2px;
            background: linear-gradient(135deg, var(--primary-cyan), var(--primary-purple), var(--primary-pink));
            border-radius: 1.5rem;
            z-index: -1;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .video-container:hover::before {
            opacity: 0.6;
        }

        .video-container video {
            width: 100%;
            aspect-ratio: 16/9;
            object-fit: cover;
            display: block;
        }

        .info-panel {
            border-radius: 1.5rem;
            padding: 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 2rem;
            flex-wrap: wrap;
            position: relative;
            overflow: hidden;
        }

        .info-panel::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            transition: left 0.5s ease;
            border-radius: 1.5rem;
        }

        .info-panel:hover::before {
            left: 100%;
        }

        .file-info h4 {
            color: var(--text-muted);
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 0.5rem;
        }

        .file-name {
            word-break: break-word;
            font-family: 'Orbitron', monospace;
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary-cyan), var(--primary-purple));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .panel-actions {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            flex-wrap: wrap;
        }

        .size-control {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            background: var(--dark-accent);
            padding: 0.5rem 1rem;
            border-radius: 2rem;
            border: 1px solid var(--glass-border);
        }

        .size-control i {
            color: var(--text-secondary);
        }

        input[type="range"] {
            -webkit-appearance: none;
            width: 120px;
            height: 4px;
            background: var(--dark-bg);
            border-radius: 2px;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: var(--primary-cyan);
            border-radius: 50%;
            border: 2px solid var(--dark-bg);
        }

        .action-buttons {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .action-btn {
            position: relative;
            padding: 0.875rem 1.5rem;
            border: none;
            border-radius: 1rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            transition: all 0.3s ease;
            overflow: hidden;
            background: linear-gradient(135deg, var(--primary-cyan), var(--primary-purple));
            color: white;
        }

        .action-btn.secondary {
            background: linear-gradient(135deg, var(--primary-purple), var(--primary-pink));
        }

        .action-btn.tertiary {
            background: linear-gradient(135deg, var(--primary-pink), var(--primary-orange));
        }

        .action-btn.quaternary {
            background: var(--dark-accent);
        }

        .more-players-dropdown {
            position: absolute;
            bottom: 110%;
            right: 0;
            width: 280px;
            padding: 1rem;
            border-radius: 1rem;
            z-index: 110;
            opacity: 0;
            visibility: hidden;
            transform: translateY(10px);
            transition: all 0.3s ease;
        }

        .more-players-dropdown.active {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .dropdown-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
        }

        .player-btn {
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid var(--glass-border);
            color: var(--text-secondary);
            padding: 0.75rem;
            border-radius: 0.75rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .player-btn:hover {
            background: var(--primary-cyan);
            color: white;
            transform: scale(1.05);
        }

        .player-btn img {
            width: 24px;
            height: 24px;
        }

        .player-btn span {
            font-weight: 500;
        }

        .explore-section {
            margin: 6rem 0;
        }

        .section-title {
            font-family: 'Orbitron', monospace;
            font-size: 3rem;
            font-weight: 900;
            text-align: center;
            margin-bottom: 3rem;
            background: linear-gradient(135deg, var(--primary-cyan), var(--primary-purple), var(--primary-pink));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .cards-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 2rem;
        }

        .info-card {
            border-radius: 1.5rem;
            padding: 2.5rem;
            text-align: center;
            position: relative;
            overflow: hidden;
            transition: all 0.4s ease;
            transform-style: preserve-3d;
        }

        .info-card:hover {
            transform: perspective(1000px) rotateX(5deg) rotateY(5deg) translateZ(20px);
        }
