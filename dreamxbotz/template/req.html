    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />

    <style>
        /* ==============================================
           All CSS from previous code retained + updated
           Author: 【𝐃𝐞𝐯𝐞𝐥𝐨𝐩𝐞𝐫_𝐁𝐨𝐲™(𝓐𝓷𝓴𝓲𝓽_𝓜𝓮𝓮𝓷𝓪😝)】 
        ============================================== */
        :root {
            --primary-cyan: #06b6d4;
            --primary-purple: #8b5cf6;
            --primary-pink: #ec4899;
            --primary-orange: #f59e0b;
            --dark-bg: #0f172a;
            --dark-secondary: #1e293b;
            --dark-accent: #334155;
            --glass-bg: rgba(15, 23, 42, 0.4);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-primary: #f8fafc;
            --text-secondary: #cbd5e1;
            --text-muted: #64748b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, var(--dark-bg) 0%, #1a1a2e 50%, var(--dark-bg) 100%);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            min-height: 100vh;
        }

        #particle-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .gradient-overlay {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at 30% 20%, rgba(6, 182, 212, 0.15), transparent 50%),
                        radial-gradient(circle at 70% 80%, rgba(139, 92, 246, 0.15), transparent 50%),
                        radial-gradient(circle at 40% 60%, rgba(236, 72, 153, 0.1), transparent 50%);
            z-index: 2;
            pointer-events: none;
        }

        .glass {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            padding: 1rem 2rem;
            background: linear-gradient(180deg, rgba(15, 23, 42, 0.9) 0%, transparent 100%);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-border);
        }

        .header-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            max-width: 1400px;
            margin: 0 auto;
        }

        .logo {
            font-family: 'Orbitron', monospace;
            font-size: 1.75rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--primary-cyan), var(--primary-purple));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-decoration: none;
            transition: all 0.3s ease;
            position: relative;
        }

        .logo::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 0;
            height: 2px;
            background: linear-gradient(135deg, var(--primary-cyan), var(--primary-purple));
            transition: width 0.3s ease;
        }

        .logo:hover::after {
            width: 100%;
        }

        .nav {
            display: flex;
            align-items: center;
            gap: 2rem;
        }

        .nav a {
            color: var(--text-secondary);
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
            position: relative;
            padding: 0.5rem 0;
        }

        .nav a:hover {
            color: var(--primary-cyan);
        }

        .mobile-menu-btn {
            display: none;
            background: none;
            border: none;
            color: var(--text-primary);
            font-size: 1.5rem;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .mobile-menu-btn:hover {
            transform: rotate(90deg);
        }

        .mobile-nav {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border-top: 1px solid var(--glass-border);
            padding: 1rem;
        }

        .mobile-nav.active {
            display: block;
        }

        .mobile-nav a {
            display: block;
            padding: 1rem;
            color: var(--text-secondary);
            text-decoration: none;
            transition: all 0.3s ease;
            border-radius: 8px;
        }

        .mobile-nav a:hover {
            background: rgba(255, 255, 255, 0.05);
            color: var(--primary-cyan);
        }

        .main-container {
            position: relative;
            z-index: 10;
            padding-top: 6rem;
            max-width: 1400px;
            margin: 0 auto;
            padding-left: 2rem;
            padding-right: 2rem;
            transition: max-width 0.5s ease-in-out;
        }

        .video-section {
            margin-bottom: 4rem;
        }

        .video-container {
            position: relative;
            margin-bottom: 2rem;
            border-radius: 1.5rem;
            overflow: hidden;
            background: var(--dark-secondary);
            transition: all 0.3s ease;
        }

        .video-container::before {
            content: '';
            position: absolute;
            inset: -2px;
            background: linear-gradient(135deg, var(--primary-cyan), var(--primary-purple), var(--primary-pink));
            border-radius: 1.5rem;
            z-index: -1;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .video-container:hover::before {
            opacity: 0.6;
        }

        .video-container video {
            width: 100%;
            aspect-ratio: 16/9;
            object-fit: cover;
            display: block;
        }

        .info-panel {
            border-radius: 1.5rem;
            padding: 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 2rem;
            flex-wrap: wrap;
            position: relative;
            overflow: hidden;
        }

        .file-info h4 {
            color: var(--text-muted);
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 0.5rem;
        }

        .file-name {
            word-break: break-word;
            font-family: 'Orbitron', monospace;
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary-cyan), var(--primary-purple));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            position: relative;
        }

        .cursor {
            display: inline-block;
            width: 2px;
            height: 1.5rem;
            background: var(--primary-cyan);
            animation: blink 1s infinite;
            margin-left: 2px;
        }

        @keyframes blink {
            50% { opacity: 0; }
        }

        .panel-actions {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            flex-wrap: wrap;
        }

        .action-buttons {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            position: relative;
        }

        .action-btn {
            position: relative;
            padding: 0.875rem 1.5rem;
            border: none;
            border-radius: 1rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            transition: all 0.3s ease;
            overflow: hidden;
            background: linear-gradient(135deg, var(--primary-cyan), var(--primary-purple));
            color: white;
        }

        .action-btn img { width: 24px; height: 24px; }
        .action-btn.secondary { background: linear-gradient(135deg, var(--primary-purple), var(--primary-pink)); }
        .action-btn.tertiary { background: linear-gradient(135deg, var(--primary-pink), var(--primary-orange)); }
        .action-btn.quaternary { background: var(--dark-accent); }

        .more-players-dropdown {
            position: absolute;
            bottom: 110%;
            right: 0;
            width: 280px;
            padding: 1rem;
            border-radius: 1rem;
            z-index: 110;
            opacity: 0;
            visibility: hidden;
            transform: translateY(10px);
            transition: all 0.3s ease;
        }

        .more-players-dropdown.active {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .dropdown-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
        }

        .player-btn {
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid var(--glass-border);
            color: var(--text-secondary);
            padding: 0.75rem;
            border-radius: 0.75rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .player-btn:hover {
            background: var(--primary-cyan);
            color: white;
            transform: scale(1.05);
        }

        .player-btn img { width: 24px; height: 24px; }

        @media (max-width: 768px) {
            .nav { display: none; }
            .mobile-menu-btn { display: block; }
            .main-container { padding-left: 1rem; padding-right: 1rem; }
        }
    </style>
</head>
